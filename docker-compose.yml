version: "3.8"

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_container
    ports:
      - "14333:1433" # avoid conflict with Windows SQL Server on 1433
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BedAsgm1!"
    volumes:
      - mssql_data:/var/opt/mssql

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - sql-server
    environment:
      MSSQL_SA_PASSWORD: "BedAsgm1!"
    volumes:
      - ./BED_ASGM1_SQLSCRIPT.sql:/init.sql:ro
      - ./sql-init.sh:/sql-init.sh:ro
    entrypoint: [ "/bin/bash", "/sql-init.sh" ]
    restart: "no"

volumes:
  mssql_data:
